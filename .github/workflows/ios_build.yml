name: iOS IPA Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Автоматическая установка Godot 4.3 и ВСЕХ его шаблонов (включая ios.zip)
      - name: Download Godot & Export Templates
        run: |
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          
          # Флаги -fL и User-Agent гарантируют корректную загрузку без сохранения HTML-ошибок
          curl -fL -A "Mozilla/5.0" "https://downloads.tuxfamily.org/godotengine/4.3/Godot_v4.3-stable_export_templates.tpz" -o templates.tpz
          
          # Распаковываем .tpz как стандартный zip-архив
          unzip -q templates.tpz -d temp_templates
          
          # Перемещаем содержимое директории templates в целевую папку Godot
          mv temp_templates/templates/* "$TEMPLATE_DIR/"
          
          # Очищаем временные файлы
          rm -rf temp_templates templates.tpz

      # 2. Установка самого бинарника Godot Engine 4.3
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      # 3. Экспорт Xcode-проекта из Godot
      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/Clicker.xcodeproj

      # 4. Компиляция в .ipa через xcodebuild
      - name: Build Xcode Project to .ipa
        run: |
          cd build/ios
          xcodebuild -project Clicker.xcodeproj \
                     -scheme Clicker \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
          
          mkdir -p Payload
          cp -R build/Release-iphoneos/Clicker.app Payload/
          zip -r Clicker.ipa Payload

      # 5. Выгрузка готового .ipa
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clicker-iOS-IPA
          path: build/ios/Clicker.ipa