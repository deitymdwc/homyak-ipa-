name: iOS IPA Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Автоматическая установка Godot 4.3 и ВСЕХ его шаблонов (включая ios.zip)
      - name: Download Godot & Export Templates
        run: |
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          # Скачивание напрямую с GitHub Releases (официальный зеркальный источник)
          curl -fL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o templates.tpz

          # Распаковка во временную папку
          unzip -q templates.tpz -d temp_templates

          # Перемещение файлов шаблонов
          mv temp_templates/templates/* "$TEMPLATE_DIR/"

          # Очистка
          rm -rf temp_templates templates.tpz

      # 2. Установка самого бинарника Godot Engine 4.3
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Fill all empty icon slots
        run: |
          python3 -c "
          with open('export_presets.cfg', 'r') as f:
              lines = f.readlines()
          with open('export_presets.cfg', 'w') as f:
              for line in lines:
                  if line.strip().startswith('icons/') and '=""' in line:
                      key = line.split('=')[0]
                      f.write(f'{key}=\"res://icon.svg\"\n')
                  else:
                      f.write(line)
          "

      # 3. Импорт ресурсов и Экспорт Xcode-проекта
      - name: Import Assets & Export Xcode Project
        run: |
          mkdir -p build/ios

          # Шаг 1: Принудительная импортация ресурсов и генерация файлов UID (.godot)
          godot --headless --editor --quit || true

          # Шаг 2: Повторный генерационный проход экспорта
          godot --headless --export-release "iOS" build/ios/Clicker.xcodeproj

      # 4. Компиляция в .ipa через xcodebuild
      - name: Build Xcode Project to .ipa
        run: |
          cd build/ios
          xcodebuild -project Clicker.xcodeproj \
                     -scheme Clicker \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
          
          mkdir -p Payload
          cp -R build/Release-iphoneos/Clicker.app Payload/
          zip -r Clicker.ipa Payload

      # 5. Выгрузка готового .ipa
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clicker-iOS-IPA
          path: build/ios/Clicker.ipa