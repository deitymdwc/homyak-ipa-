name: iOS IPA Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Установка Godot 4.3.0
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      # 2. Скачивание и правильная распаковка шаблонов 4.3.stable (включая ios.zip)
      - name: Download Godot Export Templates
        run: |
          GODOT_VERSION="4.3.stable"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATES_DIR"
          
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o templates.zip
          unzip templates.zip
          mv templates/* "$TEMPLATES_DIR/"
          rm -rf templates templates.zip

      # 3. Экспорт Xcode-проекта
      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/Clicker.xcodeproj

      # 4. Компиляция и упаковывание в .ipa
      - name: Build Xcode Project to .ipa
        run: |
          cd build/ios
          xcodebuild -project Clicker.xcodeproj \
                     -scheme Clicker \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
          
          mkdir -p Payload
          cp -R build/Release-iphoneos/Clicker.app Payload/
          zip -r Clicker.ipa Payload

      # 5. Выгрузка .ipa
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clicker-iOS-IPA
          path: build/ios/Clicker.ipa