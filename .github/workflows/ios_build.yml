name: iOS IPA Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Установка Godot Engine
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0 # Укажите точную версию своего Godot (например, 4.3.0 или 4.2.2)
          use-dotnet: false

      # 2. Загрузка и установка шаблонов экспорта Godot (Export Templates)
      - name: Download Godot Export Templates
        run: |
          GODOT_VERSION="4.7.2.stable" # Поменяйте на вашу версию, например: 4.2.2.stable
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATES_DIR"
          
          curl -LO "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* "$TEMPLATES_DIR/"
          rm -rf templates Godot_v${GODOT_VERSION}_export_templates.tpz

      # 3. Экспорт Xcode-проекта из Godot
      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/Clicker.xcodeproj

      # 4. Компиляция Xcode и сборка .ipa
      - name: Build Xcode Project to .ipa
        run: |
          cd build/ios
          xcodebuild -project Clicker.xcodeproj \
                     -scheme Clicker \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
          
          mkdir -p Payload
          cp -R build/Release-iphoneos/gomyak.app Payload/
          zip -r gomyak.ipa Payload

      # 5. Сохранение .ipa в артефакты
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homyak Kombat
          path: build/ios/gomyak.ipa