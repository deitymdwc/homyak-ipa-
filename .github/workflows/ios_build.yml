name: iOS IPA Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Автоматическая установка Godot и ЕГО ЖЕ шаблонов экспорта
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          export-templates: true # Экшен сам скачает нужные шаблоны экспорта

      # 2. Экспорт Xcode-проекта из Godot
      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/Clicker.xcodeproj

      # 3. Компиляция и упаковывание в .ipa
      - name: Build Xcode Project to .ipa
        run: |
          cd build/ios
          xcodebuild -project Clicker.xcodeproj \
                     -scheme Clicker \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build
          
          mkdir -p Payload
          cp -R build/Release-iphoneos/Clicker.app Payload/
          zip -r Clicker.ipa Payload

      # 4. Выгрузка готового .ipa в артефакты
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clicker-iOS-IPA
          path: build/ios/Clicker.ipa